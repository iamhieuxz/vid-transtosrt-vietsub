whisper:
  model_size: large-v3
  device: cuda
  compute_type: int8
  language: ja
  beam_size: 8
  vad_filter: true
  min_silence_duration_ms: 700
  speech_pad_ms: 300
project:
  name: JUL-308
  source_lang: Japanese
  target_lang: Vietnamese
  input_srt: E:/HIDE/JAV/JUL-308/JUL-308/JUL-308.mp4
  output_srt: E:\HIDE\JAV\JUL-308\JUL-308
window:
  size: 6
  history: 12
  future: 4
translation:
  mode: uncen
  literal_mode: false
  chunk_size: 3
models:
  default:
    name: huihui_ai/qwen3-abliterated:8b-v2
    ollama_url: http://localhost:11434/api/generate
    temperature: 0.05
    repeat_penalty: 1.3
    num_ctx: 4096
    num_predict: 1024
    timeout: 180
  uncen:
    name: huihui_ai/qwen3-abliterated:8b-v2
    ollama_url: http://localhost:11434/api/generate
    temperature: 0.05
    repeat_penalty: 1.3
    num_ctx: 4096
    num_predict: 1024
    timeout: 300
  ja:
    name: huihui_ai/qwen3-abliterated:8b-v2
    ollama_url: http://localhost:11434/api/generate
    temperature: 0.1
    repeat_penalty: 1.2
    num_ctx: 4096
    num_predict: 1024
    timeout: 180
pipeline:
  enable_glossary: true
  max_retries: 5
  retry_delay: 2
  num_workers: 1
  checkpoint_interval: 20
  heartbeat_timeout: 600
  circuit_breaker_threshold: 5
  circuit_breaker_cooldown: 60
  split_long_subs: false
  sub_max_duration_ms: 6000
model:
  name: huihui_ai/qwen3-abliterated:8b-v2
  ollama_url: http://localhost:11434/api/generate
  temperature: 0.05
  repeat_penalty: 1.3
  num_ctx: 4096
  num_predict: 1024
  timeout: 300
ja_context:
  enabled: false
  window_size: 18
  scene_review_size: 36
  worker_c_enabled: false
ja_trans2:
  enabled: false
  batch_size: 5
glossary:
- source: おちんちん
  target: dương vật
  context: từ thân mật
- source: ペニス
  target: dương vật
  context: từ y khoa katakana
- source: ちんこ
  target: dương vật
  context: từ thô, tiếng lóng
- source: ご無
  target: không xuất (ra ngoài)
  context: sex - gọi tắt của 無断/ぶる遮掩, " không xuất tinh ra ngoài"
- source: 生殖器
  target: bộ phận sinh dục
  context: sex - dùng "âm đạo/dương vật" khi có thể, tránh y khoa cứng
- source: 精液
  target: tinh dịch
  context: sex - tinh trùng chỉ dùng khi cần chính xác
- source: 主人
  target: chồng
  context: "chồng" BẮT BUỘC trong JAV. KHÔNG BAO GIỜ dịch "主人" thành "chủ nhân" (master/lord). Ngữ cảnh: vợ nói về chồng mình. Ví dụ: 主人を裏切って = phản bội chồng. Đây là LUẬT tuyệt đối.
- source: 裏切る
  target: phản bội
  context: danh từ hóa - 裏切った = đã phản bội
- source: 一部
  target: một phần
  context: 部分 của, không phải "chỉ đạo"
- source: 指示
  target: hướng dẫn
  context: dạng danh từ - chỉ dẫn, không phải mệnh lệnh
- source: 私的な
  target: riêng tư
  context: tính từ - cá nhân, không phải "cá nhân hóa"
- source: そう
  target: ừ
  context: đồng ý nhẹ, KHÔNG dịch "vâng" (quá trang trọng)
recent_projects:
- E:/HIDE/JAV/JUL-462.mp4
