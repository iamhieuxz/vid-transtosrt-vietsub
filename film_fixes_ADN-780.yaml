mora_clip:
  - { pattern: '^\s*さんのまんこ', replace: お母さんのまんこ }
  - { pattern: '^\s*さんの\s*(エッチ|イッチ)', replace: 'お母さんの\1' }
  - { pattern: '^\s*関だから', replace: 玄関だから }
  - { pattern: '^\s*活(は|はどう|が|を|の|も)', replace: '就活\1' }
  - { pattern: '^\s*たいなお母さん', replace: みたいなお母さん }

source_conditioned:
  - { source: 娘を身ごもっ, target: '\bcô ấy mang thai\b', replace: tôi mang thai con gái }
  - { source: 一人で娘を育て, target: '\bnuôi cô ấy một mình\b', replace: một mình nuôi con gái }
  - { source: 私のようにはなってほしくない, target: '\bcô ấy giống tôi\b', replace: con bé khổ như tôi }
  - { source: '(てんてんとしてきた|転々としてきた)', target: '\blàm việc toàn thời gian với hợp đồng chính thức\b', replace: làm đủ thứ công việc thời vụ bấp bênh }
  - { source: 娘には笑っててほしい, target: '\btớ muốn con gái tớ thấy tớ cười\b', replace: tôi chỉ muốn con gái mình luôn mỉm cười }
  - { source: ちんぽ見て, target: '\btớ (cũng đã )?nhìn dương vật của anh\b', replace: cô cứ nhìn dương vật của tôi }
  - { source: 女王様, target: '\blà\s+Joo\b|\bJoo\b', replace: kiểu tiểu thư kiêu kỳ }
  - { source: 誰かさん, target: '\bDai(?:-san)?\b', replace: ai đó }
  - { source: '(強石さん|ツヨシさん|つよしさん|つゆきくん|ツヨシ君)', target: '\b(Oishi(?:-san)?|Tsuyuki(?:-kun)?)\b', replace: Tsuyoshi }
  - { source: 城南大学, target: 'Đại học\s+Minamiyo', replace: Đại học Jonan }
  - { source: '(いうことでどう|ゆう子でどう)', target: '\bYuko\s+thì\s+sao\b', replace: coi như vậy đi nhé }
  - { source: お母さん, target: '^Mẹ con,\s*', replace: 'Mẹ ơi, ' }
