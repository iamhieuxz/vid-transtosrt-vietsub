# glossary_uncen.yaml
# Tu TINH DUC — chi nap khi config.translation.mode = "uncen".
# Day la LUAT: LLM phai dung dung target, KHONG tu doi sang tu Han Viet lich su.
#
# Nguyen tac viet target:
# - NGAN (1-3 tu). Target dai ("quan he tinh duc de co thai") LLM khong dung →
#   do duoc 子作り chi khop 0/3 lan o JUR-776.
# - KHONG chua dau ngoac/giai thich. Giai thich de trong context_hint.
# - Nhieu tu Nhat cung 1 nghia → cung 1 target (dong nhat tu vung).
# - KHONG them term qua rong (する, やる, 出す, 前に, 中に) — se ep sai nghia hang loat.
# - Target da nghia: viet bang CAU, KHONG dung "a / b / c" (LLM se sinh ra
#   nhieu dong cho 1 dong input → lech mapping ca window).
# - Target cua tu lien quan tinh duc: GHI TU LICH SU o context_hint de LLM
#   khong tu thay bang tu nhe/lich su (vi du: "bạn tình" → "người tình").
#
# Schema: source_term / target_term / context_hint

